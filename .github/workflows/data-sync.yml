name: Sync data on release

on:
  repository_dispatch:
    types: [mendeleev_created]
  workflow_dispatch:
    inputs:
      version:
        description: "mendeleev version (e.g. v1.0.0)"
        required: true
        type: string

jobs:
  create-data-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          path: mendeleev-data

      - uses: actions/checkout@v7
        with:
          repository: lmmentel/mendeleev
          ref: ${{ github.event.client_payload.version || inputs.version }}
          path: mendeleev

      - name: Install dependencies
        run: pip install invoke

      - name: Export data
        run: cd mendeleev && inv export --dest ../mendeleev-data/data

      - name: Install mendeleev-data package
        run: cd mendeleev-data && pip install -e .

      - name: Format exported data
        run: cd mendeleev-data && python -m scripts.format_all --data-dir data --db-path ../mendeleev/mendeleev/elements.db

      - name: Update README with version info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.client_payload.version || inputs.version }}
        run: |
          cd mendeleev-data
          python3 - <<'EOF'
          import os, re, subprocess

          version = os.environ["VERSION"]
          readme = Path("README.md")
          content = readme.read_text()

          # Update current version section
          content = re.sub(
              r"## Current Version\n.*?(?=\n## )",
              f"## Current Version\n\nThis repository contains data for **mendeleev {version}**.\n\n"
              f"[View mendeleev {version} release notes](https://github.com/lmmentel/mendeleev/releases/tag/{version})\n\n",
              content,
              flags=re.DOTALL,
          )

          # Build previous versions table from GitHub releases
          result = subprocess.run(
              ["gh", "release", "list", "-R", "lmmentel/mendeleev-data",
               "--json", "tagName", "-L", "50", "--jq",
               '.[1:] | sort_by(.tagName) | reverse'],
              capture_output=True, text=True
          )
          import json
          releases = json.loads(result.stdout) if result.stdout.strip() else []

          rows = []
          for r in releases:
              tag = r["tagName"]
              rows.append(
                  f"| [{tag}](https://github.com/lmmentel/mendeleev-data/releases/tag/{tag})"
                  f" | [mendeleev {tag}](https://github.com/lmmentel/mendeleev/releases/tag/{tag}) |"
              )
          table = "\n".join(rows) if rows else "_No previous releases._"

          content = re.sub(
              r"## Previous Versions\n.*?(?=\n## |\Z)",
              f"## Previous Versions\n\n| Data Release | Mendeleev Release |\n|---|---|\n{table}\n\n",
              content,
              flags=re.DOTALL,
          )

          readme.write_text(content)
          print(f"README updated for {version}")
          EOF

      - name: Update pyproject.toml version pins
        run: |
          VERSION="${{ github.event.client_payload.version || inputs.version }}"
          VERSION_NUM="${VERSION#v}"
          cd mendeleev-data
          sed -i "s/^version = .*/version = \"${VERSION_NUM}\"/" pyproject.toml
          sed -i "s/^mendeleev = .*/mendeleev = \"${VERSION_NUM}\"/" pyproject.toml

      - name: Ensure auto-merge label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh label create "auto-merge" --description "Auto-merge after CI passes" 2>/dev/null || true

      - name: Create branch, commit, and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.event.client_payload.version || inputs.version }}"
          cd mendeleev-data
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "data/${VERSION}"
          git add -A
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Data update for mendeleev ${VERSION}"
          git push origin "data/${VERSION}"
          gh pr create \
            --title "Data update for mendeleev ${VERSION}" \
            --body "Automated data export for mendeleev ${VERSION}." \
            --label "auto-merge"
