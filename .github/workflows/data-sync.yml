name: Sync data on release

on:
  repository_dispatch:
    types: [mendeleev_created]
  workflow_dispatch:
    inputs:
      version:
        description: "mendeleev version (e.g. v1.0.0)"
        required: true
        type: string

jobs:
  create-data-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          path: mendeleev-data

      - uses: actions/checkout@v7
        with:
          repository: lmmentel/mendeleev
          ref: ${{ github.event.client_payload.version || inputs.version }}
          path: mendeleev

      - name: Install dependencies
        run: pip install invoke

      - name: Export data
        run: cd mendeleev && inv export --dest ../mendeleev-data/data

      - name: Install mendeleev-data package
        run: cd mendeleev-data && pip install .

      - name: Format exported data
        run: cd mendeleev-data && python -m scripts.format_all --data-dir data --db-path ../mendeleev/mendeleev/elements.db

      - name: Update README with version info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.client_payload.version || inputs.version }}
        run: cd mendeleev-data && python -m scripts.update_readme "$VERSION"

      - name: Update version in pyproject.toml
        run: |
          VERSION="${{ github.event.client_payload.version || inputs.version }}"
          VERSION_NUM="${VERSION#v}"
          cd mendeleev-data
          sed -i "s/^version = .*/version = \"${VERSION_NUM}\"/" pyproject.toml

      - name: Ensure auto-merge label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh label create "auto-merge" --description "Auto-merge after CI passes" 2>/dev/null || true

      - name: Create branch, commit, and open PR
        id: create-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.event.client_payload.version || inputs.version }}"
          cd mendeleev-data
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "data/${VERSION}"
          git add -A
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Data update for mendeleev ${VERSION}"
          git push origin "data/${VERSION}"
          gh pr create \
            --title "Data update for mendeleev ${VERSION}" \
            --body "Automated data export for mendeleev ${VERSION}." \
            --label "auto-merge"

      - name: Cleanup remote branch on failure
        if: failure() && steps.create-pr.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.event.client_payload.version || inputs.version }}"
          git push origin --delete "data/${VERSION}" 2>/dev/null || true
