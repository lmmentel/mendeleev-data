name: Create data release

on:
  push:
    branches: [main]

jobs:
  create-release:
    runs-on: ubuntu-latest
    if: startsWith(github.event.head_commit.message, 'Data update for mendeleev')
    permissions:
      contents: write
    steps:
      - name: Extract version
        id: version
        run: |
          VERSION=$(echo "${{ github.event.head_commit.message }}" | grep -oP 'v[\d.]+')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          body: |
            Data release matching [mendeleev ${{ steps.version.outputs.version }}](https://github.com/lmmentel/mendeleev/releases/tag/${{ steps.version.outputs.version }})

      - name: Update README with version info
        run: python scripts/update_readme.py ${{ steps.version.outputs.version }}

      - name: Commit README update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "Update README for ${{ steps.version.outputs.version }}"
          git push
